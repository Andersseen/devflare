name = "dev-auth"
main = "src/index.ts"
compatibility_date = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding (override in production with real database_id)
[[d1_databases]]
binding = "DB"
database_name = "dev-auth-db"
database_id = "local-dev-auth-db"
migrations_dir = "src/db/migrations"

# KV Namespace for rate limiting (persistent across workers)
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "local-rate-limit-kv"

# Environment variables
[vars]
# These are defaults for local development.
# Override via wrangler secret for production.
BETTER_AUTH_URL = "http://localhost:8787"
APP_URL = "http://localhost:4200"

# Secrets (set via: wrangler secret put BETTER_AUTH_SECRET)
# BETTER_AUTH_SECRET = "change-me-in-production"
# GITHUB_CLIENT_SECRET = "your-github-oauth-app-secret"

# D1 Migrations
[[migrations]]
tag = "v1"
new_classes = []

# Build configuration
[build]
command = "node scripts/compile-flow.mjs"

# Production environment overrides
[env.production]
name = "dev-auth-prod"

[[env.production.routes]]
pattern = "auth-devflare.andersseen.dev"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "dev-auth-db-prod"
database_id = "6028a3b7-c545-46fb-aba2-b8b444d2dce0"
migrations_dir = "src/db/migrations"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2a96a69362c9460fbf1dc6715ab0ed38"

[env.production.vars]
BETTER_AUTH_URL = "https://auth-devflare.andersseen.dev"
# Gates the CORS middleware's production rules (see src/middleware/cors.ts).
# Without this it falls back to the localhost allow-list and the deployed app
# gets no CORS headers at all.
ENVIRONMENT = "production"
DEV_AUTH_CORS_ORIGINS = "https://devflare.andersseen.dev"
# REQUIRED, not optional: enables better-auth's crossSubDomainCookie
# (auth.config.ts keys off `!!env.COOKIE_DOMAIN`). The app and the auth service
# are different subdomains, so without this the session cookie is host-only to
# auth-devflare.andersseen.dev and the browser never sends it to
# devflare.andersseen.dev — login would appear to succeed and every subsequent
# request would still be 401.
COOKIE_DOMAIN = ".andersseen.dev"
# Public half of the GitHub OAuth App credentials — it travels in the
# authorization URL, so it is not a secret. Its partner GITHUB_CLIENT_SECRET is
# set with `wrangler secret put`. The App's callback URL must be exactly
# https://auth-devflare.andersseen.dev/api/auth/callback/github
GITHUB_CLIENT_ID = "Ov23ct49BSc1NKSicmGf"
# Where the browser goes once it holds a session. This service has no landing
# page of its own (`/` redirects to `/login`), so without this a successful
# sign-in bounces straight back to the form. Also registered as a trusted
# origin, or better-auth refuses it as a callbackURL.
APP_URL = "https://devflare.andersseen.dev"
# No transactional email provider is wired up yet, so email verification is off
# (see auth.config.ts) and sign-up is restricted to these addresses instead.
# Applies to GitHub sign-in too: the address GitHub returns must be listed here.
SIGNUP_ALLOWLIST = "andriipap01@gmail.com"

# Staging environment
[env.staging]
name = "dev-auth-staging"

[[env.staging.routes]]
pattern = "auth-devflare-staging.andersseen.dev"
custom_domain = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "dev-auth-db-staging"
database_id = "fccd953b-0780-40d5-80b1-e9444c01cfe7"
migrations_dir = "src/db/migrations"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "38f688fba9d1466ea801902f36dbe2d2"

[env.staging.vars]
BETTER_AUTH_URL = "https://auth-devflare-staging.andersseen.dev"
ENVIRONMENT = "staging"
DEV_AUTH_CORS_ORIGINS = "https://devflare-staging.andersseen.dev"
COOKIE_DOMAIN = ".andersseen.dev"
SIGNUP_ALLOWLIST = "andriipap01@gmail.com"
APP_URL = "https://devflare-staging.andersseen.dev"
# Staging needs its OWN GitHub OAuth App: an App accepts a single callback URL,
# and production already claims .../api/auth/callback/github on the prod host.
# GITHUB_CLIENT_ID = "your-staging-oauth-app-id"
