name = "dev-auth"
main = "src/index.ts"
compatibility_date = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding (override in production with real database_id)
[[d1_databases]]
binding = "DB"
database_name = "dev-auth-db"
database_id = "local-dev-auth-db"
migrations_dir = "src/db/migrations"

# KV Namespace for rate limiting (persistent across workers)
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "local-rate-limit-kv"

# Environment variables
[vars]
# These are defaults for local development.
# Override via wrangler secret for production.
BETTER_AUTH_URL = "http://localhost:8787"
# Applications allowed to authenticate through this provider. This is the whole
# registration mechanism — there is no registration endpoint and no dashboard.
# Only the redirect URIs listed here are ever accepted, so adding an app is a
# reviewable diff. Client secrets live in OAUTH_CLIENT_SECRETS (a secret, set in
# .dev.vars locally / `wrangler secret put` in production), never here.
OAUTH_CLIENTS = '''[
  {
    "clientId": "devflare-dev",
    "name": "DevFlare (local)",
    "type": "web",
    "redirectURIs": ["http://localhost:4200/api/auth/callback"]
  }
]'''

# Who may administer the client registry locally. Empty means nobody — see the
# production block for why this one fails closed where SIGNUP_ALLOWLIST does not.
ADMIN_EMAILS = "test@devflare.com"

# Secrets (set via: wrangler secret put BETTER_AUTH_SECRET)
# BETTER_AUTH_SECRET = "change-me-in-production"
# GITHUB_CLIENT_SECRET = "your-github-oauth-app-secret"
# OAUTH_CLIENT_SECRETS = '{"devflare-dev":"..."}'
# ADMIN_API_TOKEN = "..."   # lets DevFlare's server call /admin/* back-channel
# SECRET_ENCRYPTION_KEY = "..."  # `openssl rand -base64 32`
#
# SECRET_ENCRYPTION_KEY seals the few settings that must be stored reversibly
# rather than hashed — today only the GitHub client secret, which this service
# has to present to GitHub in plaintext (see src/lib/secret-box.ts). Without it
# /admin/settings refuses to store one and the provider keeps reading
# GITHUB_CLIENT_SECRET from the environment. Rotating it makes every value
# already sealed under the old key unreadable; re-enter them, do not expect a
# silent fallback, because there deliberately is not one.

# D1 Migrations
[[migrations]]
tag = "v1"
new_classes = []

# Build configuration
[build]
command = "node scripts/compile-flow.mjs"

# Production environment overrides
[env.production]
name = "dev-auth-prod"

[[env.production.routes]]
pattern = "auth-devflare.andersseen.dev"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "dev-auth-db-prod"
database_id = "6028a3b7-c545-46fb-aba2-b8b444d2dce0"
migrations_dir = "src/db/migrations"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2a96a69362c9460fbf1dc6715ab0ed38"

[env.production.vars]
BETTER_AUTH_URL = "https://auth-devflare.andersseen.dev"
# Gates the CORS middleware's production rules (see src/middleware/cors.ts).
# Without this it falls back to the localhost allow-list and the deployed app
# gets no CORS headers at all.
ENVIRONMENT = "production"
DEV_AUTH_CORS_ORIGINS = "https://devflare.andersseen.dev"
# COOKIE_DOMAIN removed. It used to feed a cross-subdomain cookie setting that
# was misspelled and therefore never took effect (see auth.config.ts). Consumers
# now complete the OAuth flow and hold their own session, so this service's cookie
# stays host-only to this Worker — which is what lets an app on an unrelated
# domain work at all.
# Public half of the GitHub OAuth App credentials — it travels in the
# authorization URL, so it is not a secret. Its partner GITHUB_CLIENT_SECRET is
# set with `wrangler secret put`. The App's callback URL must be exactly
# https://auth-devflare.andersseen.dev/api/auth/callback/github
GITHUB_CLIENT_ID = "Ov23ct49BSc1NKSicmGf"
# The registered consumer applications. Adding an app here — plus its secret in
# OAUTH_CLIENT_SECRETS — is all it takes; an app in another repository needs
# nothing else from this service. Redirect URIs are matched exactly.
OAUTH_CLIENTS = '''[
  {
    "clientId": "devflare",
    "name": "DevFlare",
    "type": "web",
    "redirectURIs": ["https://devflare.andersseen.dev/api/auth/callback"]
  },
  {
    "clientId": "imageryx",
    "name": "Imageryx",
    "type": "web",
    "redirectURIs": [
      "https://imageryx-dashboard.pages.dev/proxy/auth/callback",
      "http://localhost:5173/proxy/auth/callback"
    ]
  }
]'''
# Imageryx is the worked example of an app registered from outside this
# monorepo: an entry above, plus {"imageryx":"<secret>"} in OAUTH_CLIENT_SECRETS.
# Nothing else in this service changes for it.
#
# It lists its dev callback (http://localhost:5173/...) here alongside the
# deployed one because it has no separate development provider to point at —
# it runs its local dev server against this production issuer. Loopback http is
# accepted for exactly that reason (see redirectUriError in oauth-clients.ts).
# Both URIs are matched byte for byte; a trailing slash is a different URI.
# No transactional email provider is wired up yet, so email verification is off
# (see auth.config.ts) and sign-up is restricted to these addresses instead.
# Applies to GitHub sign-in too: the address GitHub returns must be listed here.
SIGNUP_ALLOWLIST = "andriipap01@gmail.com"
# Who may administer the client registry through /admin/clients. Note the
# difference from SIGNUP_ALLOWLIST above: empty there means "no restriction",
# empty HERE means "nobody". Administering this registry decides where
# authorization codes get delivered, so not-configured must fail closed.
# Its partner ADMIN_API_TOKEN is a secret (`wrangler secret put`), used by
# DevFlare's server to call back-channel on behalf of one of these addresses.
ADMIN_EMAILS = "andriipap01@gmail.com"

# Staging environment
[env.staging]
name = "dev-auth-staging"

[[env.staging.routes]]
pattern = "auth-devflare-staging.andersseen.dev"
custom_domain = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "dev-auth-db-staging"
database_id = "fccd953b-0780-40d5-80b1-e9444c01cfe7"
migrations_dir = "src/db/migrations"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "38f688fba9d1466ea801902f36dbe2d2"

[env.staging.vars]
BETTER_AUTH_URL = "https://auth-devflare-staging.andersseen.dev"
ENVIRONMENT = "staging"
DEV_AUTH_CORS_ORIGINS = "https://devflare-staging.andersseen.dev"
SIGNUP_ALLOWLIST = "andriipap01@gmail.com"
ADMIN_EMAILS = "andriipap01@gmail.com"
OAUTH_CLIENTS = '''[
  {
    "clientId": "devflare-staging",
    "name": "DevFlare (staging)",
    "type": "web",
    "redirectURIs": ["https://devflare-staging.andersseen.dev/api/auth/callback"]
  }
]'''
# Staging needs its OWN GitHub OAuth App: an App accepts a single callback URL,
# and production already claims .../api/auth/callback/github on the prod host.
# GITHUB_CLIENT_ID = "your-staging-oauth-app-id"
