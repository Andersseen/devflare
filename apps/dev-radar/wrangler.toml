# DevRadar — Cloudflare Worker with Static Assets (spec 021).
#
# Every static page is prerendered by `pnpm nx build dev-radar` and served from
# Static Assets before the Worker runs. The Worker answers `/api/*` (DevAuth
# sign-in, the dashboard API, the GitHub webhook), the cron reconcile, and any
# route that is not prerendered (the repository detail page).
#
# This same file feeds local dev: Nitro's cloudflare dev plugin hands it to
# wrangler's getPlatformProxy(), so `pnpm dev:radar` gets a local D1 under
# .wrangler/state. getPlatformProxy reads the top level (not [env.production]),
# so the top-level values here are the development ones.
#
# Paths are relative to this file and point at the Nitro build output, so
# `pnpm nx build dev-radar` must run before `wrangler deploy`.

name = "dev-radar"
compatibility_date = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

main = "../../dist/apps/dev-radar/analog/server/index.mjs"

[assets]
binding = "ASSETS"
directory = "../../dist/apps/dev-radar/analog/public"

# DevRadar's OWN database: its session, GitHub installations and the mirrored
# repository state. Never DevFlare's `devflare-db`, DevTools' `devtools-db` or
# DevAuth's database. Locally the id only keys the miniflare state, so this
# placeholder is fine; production has its own block below.
[[d1_databases]]
binding = "DB"
database_name = "dev-radar-db"
database_id = "00000000-0000-4000-8000-000000000021"
migrations_dir = "src/server/db/migrations"

# Workers Rate Limiting bindings (src/server/lib/rate-limit.ts). Approximate,
# per Cloudflare location — a brake on abuse, not a quota. `namespace_id` must
# be unique within the account (DevTools uses 2001-2003). `period` is 10 or 60.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "2101"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "MUTATION_RATE_LIMITER"
namespace_id = "2102"
simple = { limit = 10, period = 60 }

# Saving a dashboard layout (spec 022): cheap and frequent, so it has its own
# more generous bucket instead of sharing the manual-sync one.
[[ratelimits]]
name = "PREFERENCES_RATE_LIMITER"
namespace_id = "2103"
simple = { limit = 60, period = 60 }

[vars]
# DevRadar is its own registered OAuth client of DevAuth — never DevFlare's.
# These three must line up with the `dev-radar-dev` entry in
# apps/dev-auth/wrangler.toml's OAUTH_CLIENTS. DEV_AUTH_CLIENT_SECRET is a
# secret: apps/dev-radar/.dev.vars locally, `wrangler secret put` when deployed,
# and it must equal OAUTH_CLIENT_SECRETS["dev-radar-dev"] on the DevAuth side.
DEV_AUTH_URL = "http://localhost:8787"
DEV_AUTH_CLIENT_ID = "dev-radar-dev"
DEV_AUTH_REDIRECT_URI = "http://localhost:4400/api/auth/callback"

# DevAuth authenticates; DevRadar authorizes. Comma-separated DevAuth user ids
# (`sub`) and/or emails allowed to use DevRadar. Empty = nobody. Locally both
# the seeded test user and the owner. Prefer user ids in production.
DEVRADAR_ALLOWED_USERS = "test@devflare.com,andriipap01@gmail.com"

# GitHub App (read-only monitoring). The public identifiers are vars; the
# private key and webhook secret are SECRETS (.dev.vars / `wrangler secret put`):
#   GITHUB_APP_PRIVATE_KEY, GITHUB_WEBHOOK_SECRET
# Unset GITHUB_APP_ID = DevRadar runs in its "disconnected" state and says so.
# GITHUB_APP_ID = ""
# GITHUB_APP_SLUG = ""           # the app's URL name; builds the install link

# Max GitHub API requests one sync run may spend (Workers' free plan allows 50
# external subrequests per invocation; raise it on a paid plan).
GITHUB_SYNC_REQUEST_BUDGET = "45"

# Reconcile missed webhooks: re-sync stale repositories every six hours.
[triggers]
crons = ["17 */6 * * *"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Production — deployed by `.github/workflows/deploy.yml` after the one-time
# prerequisites in DEPLOY.md › DevRadar are complete.
# ---------------------------------------------------------------------------
[env.production]
name = "dev-radar"

# Attaching a custom domain creates DNS records on deploy. This route is
# enabled for the first production deployment (DEPLOY.md › DevRadar).
[[env.production.routes]]
pattern = "devradar.andersseen.dev"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "dev-radar-db"
database_id = "6c55ee87-3adb-4f87-af45-2c74bfa7b7cf"
migrations_dir = "src/server/db/migrations"

[[env.production.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "2101"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "MUTATION_RATE_LIMITER"
namespace_id = "2102"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "PREFERENCES_RATE_LIMITER"
namespace_id = "2103"
simple = { limit = 60, period = 60 }

[env.production.triggers]
crons = ["17 */6 * * *"]

[env.production.vars]
DEV_AUTH_URL = "https://auth-devflare.andersseen.dev"
DEV_AUTH_CLIENT_ID = "dev-radar"
DEV_AUTH_REDIRECT_URI = "https://devradar.andersseen.dev/api/auth/callback"
# The owner may be listed by DevAuth user id (`sub`) or email. Prefer the id
# when available; email is accepted here so the production deployment is
# usable before the identity record is copied into configuration.
DEVRADAR_ALLOWED_USERS = "andriipap01@gmail.com"
GITHUB_APP_ID = "5287187"
GITHUB_APP_SLUG = "andersseen-devradar"
GITHUB_SYNC_REQUEST_BUDGET = "45"

[env.production.observability]
enabled = true
