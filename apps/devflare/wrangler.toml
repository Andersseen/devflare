# DevFlare app — Cloudflare Worker with Static Assets.
#
# Single source of truth for the app worker. Paths are relative to this file and
# point at the Nitro build output, so `pnpm nx build devflare` must run before
# `wrangler deploy`.
#
# This same file feeds local dev: Nitro's cloudflare dev plugin hands it to
# wrangler's getPlatformProxy(), so `pnpm dev:app` gets a local miniflare D1
# under .wrangler/state/v3 with the bindings below. Because getPlatformProxy
# reads the top level (not [env.production]), the top-level values here are the
# development ones.

name = "devflare"
compatibility_date = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

main = "../../dist/apps/devflare/analog/server/index.mjs"

[assets]
binding = "ASSETS"
directory = "../../dist/apps/devflare/analog/public"

# App database (projects, deployments). Created 2026-07-28.
[[d1_databases]]
binding = "DB"
database_name = "devflare-db"
database_id = "399d5c02-d2b0-4537-9899-b28771b2c645"
migrations_dir = "src/server/db/migrations"

[vars]
# DevFlare is one registered OAuth client of the dev-auth provider (see
# src/server/lib/oidc.ts). These three values must line up with the matching
# entry in apps/dev-auth/wrangler.toml's OAUTH_CLIENTS, or the provider answers
# invalid_client / rejects the redirect URI.
#
# Base URL of the provider. Local dev falls back to :8787 when unset.
DEV_AUTH_URL = "http://localhost:8787"
DEV_AUTH_CLIENT_ID = "5246101a6b6132f12492e3f025354eca"
# Compared byte for byte against the registered redirect URIs, so it is spelled
# out rather than derived from the request host.
DEV_AUTH_REDIRECT_URI = "http://localhost:4200/api/auth/callback"
# DEV_AUTH_CLIENT_SECRET is a secret: apps/devflare/.dev.vars locally,
# `wrangler secret put DEV_AUTH_CLIENT_SECRET` for a deployed environment.
#
# DEV_AUTH_ADMIN_TOKEN is a secret too, and unrelated to the OAuth client secret
# above: it lets this server manage dev-auth's client registry and settings on
# behalf of a signed-in admin (Settings → Identity). It must equal
# ADMIN_API_TOKEN on the dev-auth side. Without it the Identity tab stays hidden
# and the proxy answers 503 — sign-in is unaffected either way.

# Spec 005: the Cloud section reads this account through the Cloudflare API.
# The account id is not a credential (it appears in every API URL); the token
# that goes with it is, and lives in apps/devflare/.dev.vars locally or
# `wrangler secret put CLOUDFLARE_API_TOKEN` for a deployed environment.
# Scopes: Workers Scripts:Read, Cloudflare Pages:Edit, D1:Read,
# Workers KV Storage:Read, Workers R2 Storage:Read.
# Without the token the Cloud pages show a connect prompt instead of failing.
CLOUDFLARE_ACCOUNT_ID = "c32a93ee83fe9b5d53c63fcc73b90bb9"

# Spec 007: the same account, connected from a consent screen instead. When an
# OAuth client is configured the Cloud pages offer "Connect with Cloudflare" and
# the token above becomes a fallback. Create the client under Manage Account →
# OAuth clients (or POST /accounts/{id}/oauth_clients with an API token holding
# `OAuth Clients Write`) and register this exact redirect URI — it is compared
# byte for byte.
#
# The client id is not a credential — it travels in the authorization URL.
# Created 2026-08-17 as the private client "Devflare"; both redirect URIs below
# are registered on it and were verified against the live authorization endpoint.
CLOUDFLARE_OAUTH_CLIENT_ID = "5246101a6b6132f12492e3f025354eca"
CLOUDFLARE_OAUTH_REDIRECT_URI = "http://localhost:4200/api/v1/cloud/connect/callback"
# CLOUDFLARE_OAUTH_CLIENT_SECRET is a secret (apps/devflare/.dev.vars locally,
# `wrangler secret put` for a deployed environment), and so is
# SECRET_ENCRYPTION_KEY (`openssl rand -base64 32`) — without the latter the
# tokens have nowhere safe to live and connecting is refused up front.

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Production
# ---------------------------------------------------------------------------
[env.production]
name = "devflare"

[[env.production.routes]]
pattern = "devflare.andersseen.dev"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "devflare-db"
database_id = "399d5c02-d2b0-4537-9899-b28771b2c645"
migrations_dir = "src/server/db/migrations"

[env.production.vars]
DEV_AUTH_URL = "https://auth-devflare.andersseen.dev"
DEV_AUTH_CLIENT_ID = "devflare"
DEV_AUTH_REDIRECT_URI = "https://devflare.andersseen.dev/api/auth/callback"
CLOUDFLARE_ACCOUNT_ID = "c32a93ee83fe9b5d53c63fcc73b90bb9"
CLOUDFLARE_OAUTH_CLIENT_ID = "5246101a6b6132f12492e3f025354eca"
CLOUDFLARE_OAUTH_REDIRECT_URI = "https://devflare.andersseen.dev/api/v1/cloud/connect/callback"

[env.production.observability]
enabled = true
