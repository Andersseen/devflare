# DevFlare app — Cloudflare Worker with Static Assets.
#
# Single source of truth for the app worker. Paths are relative to this file and
# point at the Nitro build output, so `pnpm nx build devflare` must run before
# `wrangler deploy`.
#
# This same file feeds local dev: Nitro's cloudflare dev plugin hands it to
# wrangler's getPlatformProxy(), so `pnpm dev:app` gets a local miniflare D1
# under .wrangler/state/v3 with the bindings below. Because getPlatformProxy
# reads the top level (not [env.production]), the top-level values here are the
# development ones.

name = "devflare"
compatibility_date = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

main = "../../dist/apps/devflare/analog/server/index.mjs"

[assets]
binding = "ASSETS"
directory = "../../dist/apps/devflare/analog/public"

# App database (projects, deployments). Created 2026-07-28.
[[d1_databases]]
binding = "DB"
database_name = "devflare-db"
database_id = "399d5c02-d2b0-4537-9899-b28771b2c645"
migrations_dir = "src/server/db/migrations"

[vars]
# DevFlare is one registered OAuth client of the dev-auth provider (see
# src/server/lib/oidc.ts). These three values must line up with the matching
# entry in apps/dev-auth/wrangler.toml's OAUTH_CLIENTS, or the provider answers
# invalid_client / rejects the redirect URI.
#
# Base URL of the provider. Local dev falls back to :8787 when unset.
DEV_AUTH_URL = "http://localhost:8787"
DEV_AUTH_CLIENT_ID = "devflare-dev"
# Compared byte for byte against the registered redirect URIs, so it is spelled
# out rather than derived from the request host.
DEV_AUTH_REDIRECT_URI = "http://localhost:4200/api/auth/callback"
# DEV_AUTH_CLIENT_SECRET is a secret: apps/devflare/.dev.vars locally,
# `wrangler secret put DEV_AUTH_CLIENT_SECRET` for a deployed environment.
#
# DEV_AUTH_ADMIN_TOKEN is a secret too, and unrelated to the OAuth client secret
# above: it lets this server manage dev-auth's client registry and settings on
# behalf of a signed-in admin (Settings → Identity). It must equal
# ADMIN_API_TOKEN on the dev-auth side. Without it the Identity tab stays hidden
# and the proxy answers 503 — sign-in is unaffected either way.

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Production
# ---------------------------------------------------------------------------
[env.production]
name = "devflare"

[[env.production.routes]]
pattern = "devflare.andersseen.dev"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "devflare-db"
database_id = "399d5c02-d2b0-4537-9899-b28771b2c645"
migrations_dir = "src/server/db/migrations"

[env.production.vars]
DEV_AUTH_URL = "https://auth-devflare.andersseen.dev"
DEV_AUTH_CLIENT_ID = "devflare"
DEV_AUTH_REDIRECT_URI = "https://devflare.andersseen.dev/api/auth/callback"

[env.production.observability]
enabled = true
