name: Publish DevAuth SDK to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — no git push, no npm publish'
        type: boolean
        default: true
      first_release:
        description: 'First-ever release for these packages (no prior tag to diff against)'
        type: boolean
        default: false

permissions:
  contents: write # nx release commits, tags, and pushes the version bump to main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a partially-completed publish

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # nx release needs full history + existing tags

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The combined `nx release` command, not the split version/publish
      # subcommands: it's the only entry point that sequences version bump
      # -> changelog -> one git commit/tag/push -> GitHub Release creation
      # -> npm publish correctly for independently-versioned projects. The
      # split subcommands each do only their own piece — `nx release
      # version` alone never generates a changelog or creates a release at
      # all, confirmed by dry-running it during development.
      - name: Release (version, changelog, GitHub Release, npm publish)
        run: >
          pnpm nx release --yes
          ${{ inputs.first_release && '--first-release' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Default token GitHub Actions already provides every run — used
          # to create a GitHub Release per published tag (nx.json's
          # release.changelog.projectChangelogs.createRelease: "github").
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
