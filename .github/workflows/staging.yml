name: Deploy to Staging

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# NOTE: staging covers the auth service only. The Analog app has no staging
# environment yet — that would need a `devflare-db-staging` D1 plus an
# [env.staging] block in apps/devflare/wrangler.toml.
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      # Target the DB *binding*: under `--env staging` the bound database is
      # `dev-auth-db-staging`, so the old `dev-auth-db` argument never resolved.
      - name: Apply D1 migrations (staging)
        working-directory: apps/dev-auth
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Deploy auth service (staging)
        working-directory: apps/dev-auth
        run: npx wrangler deploy --env staging

      - name: Comment PR with staging URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Staging deployment ready!\n\nAuth service: https://auth-devflare-staging.andersseen.dev`
            })
