name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # Build and verify before deploying
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Auth service -> Cloudflare Workers (auth-devflare.andersseen.dev)
  deploy-auth:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Target the DB *binding*, not a database name: under `--env production`
      # the bound database is `dev-auth-db-prod`, so passing `dev-auth-db` (as
      # this workflow previously did) fails to resolve.
      - name: Apply D1 migrations
        working-directory: apps/dev-auth
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Deploy auth service
        working-directory: apps/dev-auth
        run: npx wrangler deploy --env production

  # Analog app -> Cloudflare Workers + Static Assets (devflare.andersseen.dev)
  deploy-app:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        working-directory: apps/devflare
        run: npx wrangler d1 migrations apply DB --env production --remote

      # Emits dist/apps/devflare/analog/{server,public} plus the merged
      # server/wrangler.json, and writes apps/devflare/.wrangler/deploy/config.json
      # pointing at it. The deploy step below follows that redirect.
      - name: Build
        run: pnpm nx build devflare --configuration production

      - name: Deploy app
        working-directory: apps/devflare
        run: npx wrangler deploy --env production
