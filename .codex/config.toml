[mcp_servers.angular]
args = [
    "-y",
    "@angular/cli",
    "mcp",
]
command = "npx"

[mcp_servers.context7]
enabled = true
url = "https://mcp.context7.com/mcp"

[mcp_servers.nx-mcp]
args = [
    "nx",
    "mcp",
]
command = "npx"

[mcp_servers.ngp-mcp]
command = "npx"
args = [
    "-y",
    "@ng-primitives/mcp",
]

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
]

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp"

[mcp_servers.volt-ui]
url = "https://volt-ui.pages.dev/api/mcp"
